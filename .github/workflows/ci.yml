name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Fail on high/critical advisories in anything shipped inside the app.
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in src/*.js; do node --check "$f"; done
      - name: Build installer (no publish)
        run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 7
